name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.apk'
      - 'README.md'
      - '*.md'

permissions:
  contents: write

env:
  VERSION_FILE: VERSION
  BASE_APK_URL: https://github.com/${{ github.repository }}/releases/download/base/launcher-base.apk
  # The stock launcher is signed with the public AOSP test key. Signing our
  # build with the same key means it installs as an UPDATE over the original:
  # no uninstall, no re-download of the 3 GB cache, launcher icon intact.
  BASE_CERT_SHA256: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signing key (AOSP test key, same as the stock launcher)
        run: |
          set -e
          pip install --quiet cryptography
          mkdir -p /tmp/testkey
          for f in testkey.pk8 testkey.x509.pem; do
            curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/$f?format=TEXT" \
              | base64 -d > "/tmp/testkey/$f"
          done
          ls -l /tmp/testkey
          python3 - <<'PY'
          import hashlib
          from cryptography import x509
          from cryptography.hazmat.primitives import serialization
          cert = x509.load_pem_x509_certificate(open('/tmp/testkey/testkey.x509.pem','rb').read())
          fp = hashlib.sha256(cert.public_bytes(serialization.Encoding.DER)).hexdigest()
          print('test key:', cert.subject.rfc4514_string())
          print('sha256   :', fp)
          assert fp == __import__('os').environ['BASE_CERT_SHA256'], 'unexpected test key'
          PY

      - name: Base APK
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/base.apk "$BASE_APK_URL"
          ls -lh /tmp/base.apk
          unzip -l /tmp/base.apk | grep -q 'lib/arm64-v8a/libblackrussia-client.so'
          unzip -l /tmp/base.apk | grep -c 'classes'
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, 'tools')
          import apkpack
          errs, fp = apkpack.verify('/tmp/base.apk', os.environ['BASE_CERT_SHA256'])
          assert not errs, errs
          print('base apk verified, signer', fp)
          PY

      - name: Tests
        run: CXX=clang++ ./tools/run_tests.sh

      - name: Font atlas
        run: |
          set -e
          pip install --quiet pillow
          mkdir -p /tmp/font
          unzip -o -q /tmp/base.apk 'assets/Fonts/Roboto-Regular.ttf' -d /tmp/font
          python3 tools/make_font.py --ttf /tmp/font/assets/Fonts/Roboto-Regular.ttf --out native/src/font_atlas.h
          wc -c native/src/font_atlas.h

      - name: NDK build
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "NDK=$NDK"
          cmake -S native -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/librakcheat.so
          readelf -d build/librakcheat.so | head -20

      - name: Smali toolchain
        run: |
          set -e
          mkdir -p tools/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o tools/jars/smali.jar      $base/org/smali/smali/2.5.2/smali-2.5.2.jar
          curl -fsSL -o tools/jars/baksmali.jar   $base/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar
          curl -fsSL -o tools/jars/dexlib2.jar    $base/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar
          curl -fsSL -o tools/jars/util.jar       $base/org/smali/util/2.5.2/util-2.5.2.jar
          curl -fsSL -o tools/jars/guava.jar      $base/com/google/guava/guava/28.1-jre/guava-28.1-jre.jar
          curl -fsSL -o tools/jars/failureaccess.jar $base/com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar
          curl -fsSL -o tools/jars/jcommander.jar $base/com/beust/jcommander/1.78/jcommander-1.78.jar
          curl -fsSL -o tools/jars/antlr.jar      $base/org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar
          ls -lh tools/jars

      - name: Patch APK
        run: |
          set -e
          VER=$(cat VERSION)
          mkdir -p out
          python3 tools/patch_apk.py \
            --base /tmp/base.apk \
            --lib build/librakcheat.so \
            --tools tools/jars \
            --loader-smali tools/loader.smali \
            --testkey /tmp/testkey \
            --android-home "$ANDROID_HOME" \
            --out "out/RakCRMP-Cheat-${VER}.apk"
          ls -lh out

      - name: Verify package
        run: |
          set -e
          APK=$(ls out/*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner-verify.txt
          CERT=$(grep -i 'certificate SHA-256 digest' /tmp/apksigner-verify.txt | head -1 | sed 's/.*: //' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          test "$CERT" = "$BASE_CERT_SHA256"
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          unzip -t "$APK" | tail -2
          python3 - "$APK" <<'PY'
          import sys, zipfile, struct, hashlib, zlib
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          base = zipfile.ZipFile('/tmp/base.apk')
          assert z.testzip() is None
          added = sorted(set(z.namelist()) - set(base.namelist()))
          removed = sorted(set(base.namelist()) - set(z.namelist()))
          assert set(added) <= {'lib/arm64-v8a/librakcheat.so'}, added
          assert 'lib/arm64-v8a/librakcheat.so' in added, added
          assert not removed, removed
          changed = [n for n in base.namelist() if base.read(n) != z.read(n)]
          assert len(changed) == 1 and changed[0].startswith('classes'), changed
          dex = z.read(changed[0])
          assert dex[:4] == b'dex\n' and b'Lrakcheat/Loader;' in dex and b'Lrakcheat/StatusRunnable;' in dex
          assert hashlib.sha1(dex[32:]).digest() == dex[12:32]
          assert (zlib.adler32(dex[12:]) & 0xffffffff) == struct.unpack_from('<I', dex, 8)[0]
          so = z.read('lib/arm64-v8a/librakcheat.so')
          assert so[:4] == b'\x7fELF' and struct.unpack_from('<H', so, 18)[0] == 183
          assert z.read('AndroidManifest.xml') == base.read('AndroidManifest.xml')
          assert z.read('resources.arsc') == base.read('resources.arsc')
          open('/tmp/check.dex', 'wb').write(dex)
          print('APK payload, manifest, icon resources and DEX checks passed')
          PY
          CP=$(ls tools/jars/*.jar | tr '\n' ':')
          java -cp "$CP" org.jf.baksmali.Main d <(unzip -p "$APK" classes4.dex) -o /tmp/roundtrip >/dev/null
          grep -c 'Lrakcheat/Loader;->load()V' /tmp/roundtrip/com/blackhub/bronline/game/core/JNILib.smali
          grep -c 'class public final Lrakcheat/Loader;' /tmp/roundtrip/rakcheat/Loader.smali
          grep -c 'class public final Lrakcheat/StatusRunnable;' /tmp/roundtrip/rakcheat/StatusRunnable.smali

      - uses: actions/upload-artifact@v4
        with:
          name: RakCRMP-Cheat-apk
          path: out/*.apk
          retention-days: 90

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(cat VERSION)
          TAG="v${VER}"
          NOTES="RakCRMP Cheat ${VER} — оверлей поверх оригинального RakCRMP (com.br.top)."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "RakCRMP Cheat ${VER}" --notes "$NOTES" --prerelease
          gh release upload "$TAG" out/*.apk --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
